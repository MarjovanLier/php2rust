name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The folders run their PHP side under every target version (P2R-77, ADR 0009).
  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The harness runs its Laravel fixtures on the packages the lock pins (P2R-606, P2R-608).
      - run: composer install --no-interaction --no-progress --working-dir tests/differential/laravel
      - run: cargo test --locked

  # Branch protection requires a check named test. It runs after the versions and fails
  # unless every one passed, because a job skipped after a failed need counts as passed.
  test:
    needs: php
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every PHP version passed
        run: test "${{ needs.php.result }}" = success
      - uses: actions/checkout@v5
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
