name: CI

on:
  push:
    branches: [main]
  pull_request:

# A later push to a pull request stops the run of the push before it, so the two
# self-hosted runners do not work through superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The folders run their PHP side under every target version (P2R-77, ADR 0009), each in
  # the CI image of .github/ci for that version. The repository is public, so a pull
  # request from a fork runs on a hosted runner and never on server-140, whose runners take
  # the owner's pushes and branches; Actions also asks the owner to approve every outside
  # contributor's run.
  php:
    name: php ${{ matrix.php }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","php2rust"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v5
      - name: Build the CI image for PHP ${{ matrix.php }}
        run: |
          rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          docker build -q -t "php2rust-ci:${{ matrix.php }}" \
            --build-arg "PHP=${{ matrix.php }}" --build-arg "RUST=$rust" .github/ci
      # The harness runs its Laravel fixtures on the packages the lock pins (P2R-606,
      # P2R-608). The volumes keep Cargo's downloads and each version's build between runs.
      - name: Run the tests
        run: |
          docker run --rm -e CI=true -v "$PWD:/work" -w /work \
            -v php2rust-cargo-registry:/usr/local/cargo/registry \
            -v "php2rust-target-${{ matrix.php }}:/target" -e CARGO_TARGET_DIR=/target \
            "php2rust-ci:${{ matrix.php }}" sh -ec '
              composer install --no-interaction --no-progress --working-dir tests/differential/laravel
              cargo test --locked'

  # Branch protection requires a check named test. It runs after the versions and fails
  # unless every one passed, because a job skipped after a failed need counts as passed.
  test:
    needs: php
    if: always()
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","php2rust"]') }}
    timeout-minutes: 20
    steps:
      - name: Every PHP version passed
        run: test "${{ needs.php.result }}" = success
      - uses: actions/checkout@v5
      - name: Build the CI image
        run: |
          rust=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          docker build -q -t php2rust-ci:8.5 --build-arg PHP=8.5 --build-arg "RUST=$rust" .github/ci
      - name: Check the layout and the lints
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -v php2rust-cargo-registry:/usr/local/cargo/registry \
            -v php2rust-target-lint:/target -e CARGO_TARGET_DIR=/target \
            php2rust-ci:8.5 sh -ec '
              cargo fmt --check
              cargo clippy --all-targets --locked -- -D warnings'
